<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drag Racer">
<link rel="manifest" href="manifest.json">
<title>Retro Drag Racer</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#0b0b14;color:#fff;font-family:'Courier New',monospace;overflow:hidden;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
h1{font-size:20px;margin:8px 0;color:#ffd23f;text-shadow:2px 2px #e4002b;letter-spacing:2px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cash{color:#5dff7a;font-weight:bold}
.tabs{display:flex;gap:6px;margin-bottom:8px}
button{font-family:inherit;background:#1d1d33;color:#fff;border:2px solid #4a4a80;padding:10px 12px;border-radius:6px;font-size:14px}
button.on{background:#e4002b;border-color:#ffd23f}
button:disabled{opacity:.4}
button.big{background:#e4002b;border-color:#ffd23f;font-size:18px;padding:14px;width:100%}
.panel{flex:1;overflow:auto;padding-bottom:12px}
.card{background:#14142a;border:2px solid #333366;border-radius:8px;padding:10px;margin-bottom:8px}
.card.sel{border-color:#ffd23f}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stat{font-size:12px;color:#aab}
.meter{height:6px;background:#222;border-radius:3px;margin:2px 0 4px}
.meter i{display:block;height:100%;background:#4cc9f0;border-radius:3px}
canvas{width:100%;flex:1;background:#000;border:2px solid #4a4a80;border-radius:6px;min-height:0}
#ctrl{display:flex;gap:8px;margin:8px 0}
#ctrl button{flex:1;padding:18px 0;font-size:18px}
#msg{text-align:center;min-height:22px;color:#ffd23f}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div class="bar"><h1>RETRO DRAG RACER</h1><div class="cash" id="cash"></div></div>
  <div id="menu" style="flex:1;display:flex;flex-direction:column;min-height:0">
    <div class="tabs">
      <button id="t1" class="on">Race</button>
      <button id="t2">Garage</button>
      <button id="t3">Dealer</button>
    </div>
    <div class="panel" id="panel"></div>
  </div>
  <div id="race" class="hide" style="flex:1;display:flex;flex-direction:column;min-height:0">
    <div id="msg"></div>
    <canvas id="cv"></canvas>
    <div id="ctrl">
      <button id="gas">GAS</button>
      <button id="shift">SHIFT</button>
      <button id="nos">NITRO</button>
    </div>
  </div>
</div>
<script>
// ---------- DATA ----------
const CARS=[
 {id:'kei',name:'Sakura Kei GT',cls:'JDM',price:0,hp:110,wt:830,grip:.70,color:'#ff7ab8'},
 {id:'rx',name:'Rotor RX-7R',cls:'JDM',price:9000,hp:255,wt:1250,grip:.78,color:'#ffd23f'},
 {id:'sky',name:'Skyline Gen-R',cls:'JDM',price:22000,hp:330,wt:1500,grip:.82,color:'#4cc9f0'},
 {id:'supra',name:'Titan Supra MK4',cls:'JDM',price:34000,hp:400,wt:1480,grip:.82,color:'#ff7a1a'},
 {id:'stang',name:'Bronco Stallion',cls:'Muscle',price:16000,hp:430,wt:1650,grip:.68,color:'#2d6cdf'},
 {id:'charg',name:'Brute Charger',cls:'Muscle',price:30000,hp:520,wt:1780,grip:.66,color:'#222'},
 {id:'vette',name:'Stingray C-Sport',cls:'Sports',price:48000,hp:600,wt:1520,grip:.88,color:'#e4002b'},
 {id:'ital',name:'Toro Italia V10',cls:'Super',price:90000,hp:700,wt:1450,grip:.92,color:'#9cff3a'},
 {id:'hyper',name:'Phantom Hyper-X',cls:'Super',price:160000,hp:1000,wt:1400,grip:.95,color:'#b57bff'}
];
const MODS={
 engine:{name:'Engine',max:5,cost:1500,hp:.08},
 turbo:{name:'Turbo',max:3,cost:3000,hp:.12},
 tires:{name:'Tires',max:4,cost:1200,grip:.04},
 weight:{name:'Weight Reduction',max:4,cost:1800,wt:.04},
 nitro:{name:'Nitro',max:3,cost:2500}
};
const GEARS=[3.2,2.2,1.6,1.2,.95,.78];
// ---------- SAVE ----------
let S=JSON.parse(localStorage.getItem('dragSave')||'null')||{cash:3000,owned:{kei:{}},cur:'kei',wins:0,level:1};
function save(){localStorage.setItem('dragSave',JSON.stringify(S))}
function stats(id){
 const c=CARS.find(x=>x.id===id),m=S.owned[id]||{};
 const lv=k=>m[k]||0;
 const hp=c.hp*(1+lv('engine')*MODS.engine.hp+lv('turbo')*MODS.turbo.hp);
 const wt=c.wt*(1-lv('weight')*MODS.weight.wt);
 const grip=Math.min(1.2,c.grip+lv('tires')*MODS.tires.grip);
 return{car:c,hp,wt,grip,nitro:lv('nitro')};
}
function rating(s){return Math.round(s.hp/s.wt*1000*(0.6+s.grip*.5))}
// ---------- MENU ----------
const $=id=>document.getElementById(id);
let tab=1;
function cashUpdate(){$('cash').textContent='$'+S.cash.toLocaleString()}
function bar(v,max){return '<div class="meter"><i style="width:'+Math.min(100,v/max*100)+'%"></i></div>'}
function render(){
 cashUpdate();
 ['t1','t2','t3'].forEach((t,i)=>$(t).classList.toggle('on',tab===i+1));
 const p=$('panel');let h='';
 if(tab===1){
  const s=stats(S.cur);
  h+='<div class="card sel"><div class="row"><b>'+s.car.name+'</b><span class="stat">'+s.car.cls+'</span></div>'+
  '<div class="stat">Power '+Math.round(s.hp)+' hp</div>'+bar(s.hp,1200)+
  '<div class="stat">Weight '+Math.round(s.wt)+' kg</div>'+bar(2000-s.wt,1400)+
  '<div class="stat">Grip '+s.grip.toFixed(2)+'</div>'+bar(s.grip,1.2)+
  '<div class="stat">Rating '+rating(s)+' | Wins '+S.wins+'</div></div>';
  const opp=oppFor(S.level);
  h+='<div class="card"><div class="row"><b>Next opponent</b><span class="stat">Tier '+S.level+'</span></div>'+
  '<div class="stat">'+opp.name+' - rating about '+opp.rating+'</div>'+
  '<div class="stat">Win prize $'+opp.prize.toLocaleString()+'</div></div>';
  h+='<button class="big" onclick="startRace()">START RACE</button>';
  h+='<p class="stat">Tip: tap GAS to launch right as the lights hit green. Shift near the redline. Nitro gives a short boost.</p>';
 }
 if(tab===2){
  h+='<div class="stat" style="margin-bottom:6px">Your cars. Tap one to select, then upgrade it.</div>';
  Object.keys(S.owned).forEach(id=>{
   const s=stats(id),m=S.owned[id];
   h+='<div class="card '+(id===S.cur?'sel':'')+'"><div class="row"><b>'+s.car.name+'</b>'+
   '<button onclick="pick(\''+id+'\')">'+(id===S.cur?'Selected':'Select')+'</button></div>'+
   '<div class="stat">'+Math.round(s.hp)+' hp | '+Math.round(s.wt)+' kg | grip '+s.grip.toFixed(2)+' | rating '+rating(s)+'</div>';
   if(id===S.cur){
    Object.keys(MODS).forEach(k=>{
     const M=MODS[k],lv=m[k]||0,cost=M.cost*(lv+1);
     h+='<div class="row" style="margin-top:6px"><span class="stat">'+M.name+' '+lv+'/'+M.max+'</span>'+
     (lv>=M.max?'<span class="stat">MAX</span>':'<button '+(S.cash<cost?'disabled':'')+' onclick="buyMod(\''+k+'\')">$'+cost.toLocaleString()+'</button>')+'</div>';
    });
   }
   h+='</div>';
  });
 }
 if(tab===3){
  h+='<div class="stat" style="margin-bottom:6px">Dealer. Buying a car adds it to your garage.</div>';
  CARS.filter(c=>!S.owned[c.id]).forEach(c=>{
   h+='<div class="card"><div class="row"><b>'+c.name+'</b><span class="stat">'+c.cls+'</span></div>'+
   '<div class="stat">'+c.hp+' hp | '+c.wt+' kg | grip '+c.grip+'</div>'+
   '<div class="row" style="margin-top:6px"><span></span><button '+(S.cash<c.price?'disabled':'')+' onclick="buyCar(\''+c.id+'\')">Buy $'+c.price.toLocaleString()+'</button></div></div>';
  });
  if(!CARS.some(c=>!S.owned[c.id]))h+='<div class="card">You own every car. Legend!</div>';
 }
 p.innerHTML=h;
}
function pick(id){S.cur=id;save();render()}
function buyMod(k){
 const m=S.owned[S.cur],M=MODS[k],lv=m[k]||0,cost=M.cost*(lv+1);
 if(S.cash>=cost&&lv<M.max){S.cash-=cost;m[k]=lv+1;save();render()}
}
function buyCar(id){
 const c=CARS.find(x=>x.id===id);
 if(S.cash>=c.price){S.cash-=c.price;S.owned[id]={};S.cur=id;save();render()}
}
$('t1').onclick=()=>{tab=1;render()};
$('t2').onclick=()=>{tab=2;render()};
$('t3').onclick=()=>{tab=3;render()};
// ---------- OPPONENTS ----------
const ONAMES=['Street Rookie','Corner Crew','Night Runner','Touge King','Highway Ghost','Drag Veteran','Strip Legend','Quarter-Mile God'];
function oppFor(level){
 const base=60+level*28;
 const hp=base*3+level*40, wt=1500-level*20;
 return{name:ONAMES[Math.min(level-1,ONAMES.length-1)]+(level>ONAMES.length?' '+level:''),
  hp,wt,grip:Math.min(1,.65+level*.03),rating:Math.round(hp/wt*1000*(0.6+Math.min(1,.65+level*.03)*.5)),
  prize:600+level*450,color:'#8affc1'};
}
// ---------- RACE ----------
const cv=$('cv'),ctx=cv.getContext('2d');
let R=null,raf=0;
const TRACK=402; // metres (quarter mile)
function mkRacer(s,isPlayer){
 return{hp:s.hp,wt:s.wt,grip:s.grip,color:s.car?s.car.color:s.color,
  x:0,v:0,gear:0,rpm:1000,nos:isPlayer?s.nitro:0,nosT:0,fin:0,
  isPlayer,launched:false,wheelspin:0};
}
function startRace(){
 $('menu').classList.add('hide');$('race').classList.remove('hide');
 resize();
 const ps=stats(S.cur),os=oppFor(S.level);
 R={p:mkRacer(ps,true),o:mkRacer(os,false),t:0,state:'stage',lightT:0,go:0,msg:'',cam:0,oppName:os.name,
  oppDelay:.15+Math.random()*.25,oppShiftAt:.9+Math.random()*.08,prize:os.prize,done:false};
 $('shift').textContent='SHIFT';
 runLights();
 cancelAnimationFrame(raf);last=performance.now();loop(last);
}
function runLights(){
 R.state='lights';R.lightT=0;R.go=1.6+Math.random()*1.2; // seconds until green after 3 ambers
 R.msg='Stage...';$('msg').textContent=R.msg;
}
let last=0;
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 update(dt);draw();
 raf=requestAnimationFrame(loop);
}
function physics(r,dt){
 // simple drag model: power-limited with traction limit and drag
 const g=GEARS[r.gear];
 const wheelSpeed=r.v; // m/s
 const rpm=Math.max(1000,Math.min(8200,wheelSpeed*g*95+1000));
 r.rpm=rpm;
 const powerCurve=Math.max(.35,1-Math.abs(rpm-6200)/7000);
 let P=r.hp*745.7*powerCurve;
 if(r.nosT>0){P*=1.35;r.nosT-=dt}
 const vEff=Math.max(r.v,3);
 let F=P/vEff*.82;
 const maxTraction=r.grip*r.wt*9.81*1.15;
 r.wheelspin=F>maxTraction?1:0;
 F=Math.min(F,maxTraction);
 const drag=.5*1.2*.62*2.1*r.v*r.v+r.wt*9.81*.015;
 const a=(F-drag)/r.wt;
 r.v=Math.max(0,r.v+a*dt);
 r.x+=r.v*dt;
}
function update(dt){
 if(!R)return;
 const p=R.p,o=R.o;
 if(R.state==='lights'){
  R.lightT+=dt;
  if(R.lightT>=1.5+R.go-1.0&&R.lightT<1.5+R.go&&false){}
  if(R.lightT>=1.5+R.go){R.state='racing';R.t=0;R.goTime=performance.now();R.msg='GO!';
   if(p.pressedEarly){R.msg='FALSE START! -time penalty';p.penalty=.5}}
 }else if(R.state==='racing'){
  R.t+=dt;
  // player
  if(p.launched||(p.holdGas)){p.launched=true;}
  if(p.launched&&!p.fin){
   physics(p,dt);
   if(!p.fin&&p.x>=TRACK){p.fin=R.t+(p.penalty||0);p.speedAtFin=p.v}
  }
  // opponent AI
  if(R.t>R.oppDelay&&!o.fin){
   if(o.rpm>8200*R.oppShiftAt&&o.gear<GEARS.length-1){o.gear++}
   physics(o,dt);
   if(o.x>=TRACK){o.fin=R.t;o.speedAtFin=o.v}
  }
  // player redline bounce
  if(p.rpm>8100&&p.launched){p.over=(p.over||0)+dt;if(p.over>.25){p.v*=.995}}else p.over=0;
  if(p.fin&&o.fin||(p.fin&&R.t>p.fin+3)||(o.fin&&R.t>o.fin+4)){finish()}
  R.msg=(p.launched?'':'TAP GAS!');
 }
 $('msg').textContent=R.msg;
}
function finish(){
 if(R.done)return;R.done=true;R.state='over';
 const p=R.p,o=R.o;
 const pt=p.fin||999,ot=o.fin||999;
 const win=pt<ot;
 let txt;
 if(win){
  S.cash+=R.prize;S.wins++;S.level++;save();
  txt='YOU WIN! '+pt.toFixed(2)+'s vs '+ot.toFixed(2)+'s  +$'+R.prize.toLocaleString();
 }else{
  const cons=Math.round(R.prize*.1);S.cash+=cons;save();
  txt='You lost. '+(pt<900?pt.toFixed(2):'DNF')+'s vs '+ot.toFixed(2)+'s  +$'+cons;
 }
 R.msg=txt;$('msg').textContent=txt;
 setTimeout(()=>{
  if(confirm(txt+'\n\nBack to menu?')){exitRace()}else{exitRace()}
 },600);
}
function exitRace(){
 cancelAnimationFrame(raf);R=null;
 $('race').classList.add('hide');$('menu').classList.remove('hide');
 render();
}
// ---------- DRAW ----------
function resize(){
 const r=cv.getBoundingClientRect();
 cv.width=Math.max(300,r.width*devicePixelRatio);
 cv.height=Math.max(200,r.height*devicePixelRatio);
}
addEventListener('resize',()=>{if(R)resize()});
function px(n){return n*devicePixelRatio}
function drawCar(x,y,w,color,spin){
 const h=w*.36;
 ctx.fillStyle='#000';ctx.fillRect(x+2,y+h-2,w,6);
 ctx.fillStyle=color;
 ctx.fillRect(x,y+h*.35,w,h*.55);
 ctx.fillRect(x+w*.22,y,w*.45,h*.5);
 ctx.fillStyle='#bfe9ff';
 ctx.fillRect(x+w*.28,y+h*.08,w*.15,h*.34);
 ctx.fillRect(x+w*.46,y+h*.08,w*.15,h*.34);
 ctx.fillStyle='#111';
 [w*.2,w*.75].forEach(wx=>{ctx.beginPath();ctx.arc(x+wx,y+h*.92,h*.26,0,7);ctx.fill();
  ctx.fillStyle='#888';ctx.beginPath();ctx.arc(x+wx,y+h*.92,h*.12,0,7);ctx.fill();ctx.fillStyle='#111'});
 if(spin){ctx.fillStyle='rgba(255,255,255,.6)';for(let i=0;i<4;i++)ctx.fillRect(x-px(8)-i*px(6),y+h*.9+(Math.random()*6-3),px(5),px(3))}
}
function draw(){
 if(!R)return;
 const W=cv.width,H=cv.height;
 ctx.fillStyle='#0a0620';ctx.fillRect(0,0,W,H);
 // skyline
 ctx.fillStyle='#1b1040';
 for(let i=0;i<14;i++){const bw=W/12,bh=H*(.12+((i*37)%5)*.04);ctx.fillRect(i*bw-(R.p.x*2%bw),H*.45-bh,bw*.8,bh)}
 // road lanes
 const roadTop=H*.45;
 ctx.fillStyle='#2a2a2e';ctx.fillRect(0,roadTop,W,H-roadTop);
 const laneH=(H-roadTop)/2;
 ctx.fillStyle='#fff';ctx.fillRect(0,roadTop+laneH-2,W,4);
 // moving dashes show speed
 const scroll=(R.p.x*px(10))%px(60);
 ctx.fillStyle='#555';
 for(let i=-1;i<W/px(60)+1;i++){ctx.fillRect(i*px(60)-scroll,roadTop+laneH*.5,px(30),px(3));ctx.fillRect(i*px(60)-scroll,roadTop+laneH*1.5,px(30),px(3))}
 // finish line
 const carW=W*.26,startX=W*.12;
 const scale=px(10);
 const finX=startX+(TRACK-R.p.x)*scale;
 if(finX<W+50&&finX>-50){
  for(let i=0;i<10;i++){ctx.fillStyle=i%2?'#fff':'#000';ctx.fillRect(finX,roadTop+i*(H-roadTop)/10,px(10),(H-roadTop)/10)}
 }
 // start line
 const stX=startX+(0-R.p.x)*scale+carW*.9;
 ctx.fillStyle='#ffd23f';ctx.fillRect(stX,roadTop,px(5),H-roadTop);
 // cars: opponent top lane, player bottom lane, camera follows player, opponent shown relative
 const relO=(R.o.x-R.p.x)*scale;
 drawCar(startX+relO,roadTop+laneH*.12,carW,R.o.color,R.o.wheelspin&&R.state==='racing');
 drawCar(startX,roadTop+laneH*1.12,carW,R.p.color,R.p.wheelspin&&R.state==='racing');
 // lights (christmas tree)
 const lx=W*.5,ly=H*.04;
 if(R.state==='lights'||R.state==='stage'){
  const t=R.lightT,n=t<.5?0:t<1?1:t<1.5?2:3;
  for(let i=0;i<3;i++){ctx.fillStyle=i<n?'#ffb300':'#332';ctx.beginPath();ctx.arc(lx+(i-1)*px(26),ly+px(16),px(10),0,7);ctx.fill()}
  ctx.fillStyle=t>=1.5+R.go?'#2cff6b':'#113';ctx.beginPath();ctx.arc(lx,ly+px(46),px(12),0,7);ctx.fill();
 }
 // hud
 ctx.fillStyle='#fff';ctx.font=px(14)+'px Courier New';
 ctx.fillText(Math.round(R.p.v*3.6)+' km/h  G'+(R.p.gear+1),px(8),px(20));
 ctx.fillText(R.t.toFixed(2)+'s',W-px(70),px(20));
 // rpm bar
 const rp=Math.min(1,(R.p.rpm-1000)/7200);
 ctx.fillStyle='#222';ctx.fillRect(px(8),px(28),px(120),px(8));
 ctx.fillStyle=rp>.9?'#e4002b':'#4cc9f0';ctx.fillRect(px(8),px(28),px(120)*rp,px(8));
 if(R.p.nos>0){ctx.fillStyle='#ffd23f';ctx.fillText('NITRO x'+R.p.nos,px(8),px(52))}
 // progress
 ctx.fillStyle='#222';ctx.fillRect(W*.2,H-px(10),W*.6,px(5));
 ctx.fillStyle='#5dff7a';ctx.fillRect(W*.2,H-px(10),W*.6*Math.min(1,R.p.x/TRACK),px(5));
 ctx.fillStyle='#ff7a7a';ctx.fillRect(W*.2,H-px(14),W*.6*Math.min(1,R.o.x/TRACK),px(3));
}
// ---------- CONTROLS ----------
function gasDown(e){e.preventDefault();if(!R)return;const p=R.p;
 if(R.state==='lights'){p.pressedEarly=true;p.holdGas=true}
 else if(R.state==='racing'){p.launched=true;p.holdGas=true}}
function gasUp(e){e.preventDefault();if(R)R.p.holdGas=false}
function doShift(e){e.preventDefault();if(!R||R.state!=='racing')return;const p=R.p;
 if(p.gear<GEARS.length-1){
  const good=p.rpm>6800&&p.rpm<8200;
  p.gear++;
  if(good){p.v*=1.01}else if(p.rpm<5000){p.v*=.97}
 }}
function doNos(e){e.preventDefault();if(!R||R.state!=='racing')return;const p=R.p;
 if(p.nos>0&&p.nosT<=0){p.nos--;p.nosT=2.2}}
['touchstart','mousedown'].forEach(ev=>{$('gas').addEventListener(ev,gasDown);$('shift').addEventListener(ev,doShift);$('nos').addEventListener(ev,doNos)});
['touchend','mouseup'].forEach(ev=>$('gas').addEventListener(ev,gasUp));
// ---------- BOOT ----------
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
